<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6600">
  <title>Bạn đang ngoại tuyến - YumGO</title>
  <style>
    :root {
      --primary: #ff6600;
      --ink: #1a1a2e;
      --body: #4a4a68;
      --canvas: #fff9f5;
      --card: #ffffff;
      --line: #ffe1cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--body);
      background:
        radial-gradient(circle at 80% 12%, rgba(255, 102, 0, 0.16), transparent 20rem),
        var(--canvas);
    }
    main {
      width: min(520px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 20px;
      text-align: center;
      background: var(--card);
      box-shadow: 0 18px 42px rgba(31, 27, 23, 0.12);
    }
    .icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      font-size: 34px;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: clamp(1.65rem, 6vw, 2.4rem);
      line-height: 1.12;
    }
    p {
      margin: 0 auto 24px;
      max-width: 390px;
      line-height: 1.6;
    }
    button {
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">Y</div>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>YumGO chưa tải được trang này. Vui lòng kiểm tra kết nối mạng rồi thử lại.</p>
    <button type="button" onclick="window.location.reload()">Thử lại</button>
  </main>
</body>
</html>
